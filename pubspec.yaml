name: idle_rpg_workspace
description: >-
  Idle RPG monorepo. A pure-Dart game core shared by the Flutter client and the
  Serverpod backend.
publish_to: none

environment:
  sdk: ^3.8.0

workspace:
  - packages/game_core
  - apps/client
  - apps/server
  - apps/server_client
  - tools/balance
  - tools/ci

dev_dependencies:
  melos: ^8.2.2
  very_good_analysis: ^10.2.0

melos:
  scripts:
    analyze:
      description: Static analysis across every package in the workspace.
      run: dart analyze --fatal-infos

    format:
      description: Verify formatting without writing changes.
      run: dart format --output=none --set-exit-if-changed .

    format:fix:
      description: Apply formatting in place.
      run: dart format .

    test:
      description: >-
        Run every package's tests: plain Dart packages on the VM, the Flutter
        client through the Flutter test runner.
      run: dart run melos run test:dart && dart run melos run test:client

    check:core-deps:
      description: >-
        Fail if game_core ever gains a Flutter or Flame dependency. Runs in CI
        before the tests, since a violation invalidates the server build.
      run: dart run ci_tools:check_core_deps

    check:no-wall-clock:
      description: >-
        Fail if game logic reads the device clock instead of an injected Clock.
      run: dart run ci_tools:check_no_wall_clock

    test:core:web:
      description: >-
        Run the core tests compiled to JavaScript. The seeded RNG must produce
        an identical sequence on the VM and in JS, or a client and the server
        would diverge from the same state.
      run: dart run melos exec -- dart test -p chrome
      packageFilters:
        scope: game_core

    test:dart:
      description: >-
        Run tests of the pure-Dart packages. The server is excluded on purpose:
        its integration tests need a live Postgres, see test:server.
      run: dart run melos exec -- dart test
      packageFilters:
        flutter: false
        dirExists: test
        ignore:
          - idle_rpg_server

    test:server:
      description: >-
        Serverpod integration tests. Requires the database to be up first:
        cd apps/server && docker compose up --detach
      run: dart run melos exec -- dart test
      packageFilters:
        scope: idle_rpg_server

    test:core:
      description: Run the game_core tests only.
      run: dart run melos exec -- dart test
      packageFilters:
        scope: game_core

    test:client:
      description: Run the Flutter client widget tests.
      run: dart run melos exec -- flutter test
      packageFilters:
        flutter: true
        dirExists: test
