name: idle_rpg
description: Idle RPG Flutter client.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.3

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # 3.4+ needs Dart 3.12; the Flutter SDK here ships 3.11.3.
  flutter_riverpod: ^3.3.2
  game_core: ^0.1.0
  go_router: ^17.3.0
  idle_rpg_client:
    path: ../server_client

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
