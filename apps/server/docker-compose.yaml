services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: idle_rpg
      POSTGRES_PASSWORD: "lj6u1TAu1HjezoiM0dx4wnwnPP5tKI5B"
    volumes:
      - idle_rpg_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "x8-d71s1JNFylE60FB5zJtcQPdgntRYF"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: idle_rpg_test
      POSTGRES_PASSWORD: "X0ABKwb1NT8rm7MXLb7vwsGgzS5fcpxW"
    volumes:
      - idle_rpg_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "_rmrDbNxZcQsD2EzDv3EOcHJWQ0Cr0Qh"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  idle_rpg_data:
  idle_rpg_test_data:
