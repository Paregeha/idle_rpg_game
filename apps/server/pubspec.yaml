name: idle_rpg_server
description: >-
  Serverpod backend. Authoritative owner of every player's state: it re-runs the
  same `game_core` simulation the client does and only ever accepts intents.

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  game_core: ^0.1.0
  serverpod: 3.4.11
  serverpod_auth_idp_server: 3.4.11

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 3.4.11
  test: ^1.25.5

serverpod:
  scripts:
    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations
