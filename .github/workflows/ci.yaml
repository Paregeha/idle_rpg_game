name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.5

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # A single resolution for the whole pub workspace.
      - name: Resolve workspace
        run: flutter pub get

      # Runs before the tests: if the core ever pulls in Flutter it stops
      # building on the server, which makes every test result below moot.
      - name: Guard game_core dependencies
        run: dart run melos run check:core-deps --no-select

      # Generated sources are committed, so a stale *.freezed.dart is a real
      # risk: the code would compile against a model that no longer matches.
      - name: Regenerate code
        working-directory: packages/game_core
        run: dart run build_runner build

      - name: Fail if generated code is stale
        run: git diff --exit-code -- '*.freezed.dart' '*.g.dart'

      - name: Check formatting
        run: dart run melos run format --no-select

      - name: Analyze
        run: dart run melos run analyze --no-select

      - name: Test pure-Dart packages
        run: dart run melos run test:dart --no-select

      - name: Test Flutter client
        run: dart run melos run test:client --no-select

  test-server:
    name: Server integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: idle_rpg_test
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 9090:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Resolve workspace
        run: flutter pub get

      # config/passwords.yaml is deliberately not in version control. These
      # values only ever reach the throwaway Postgres service above.
      - name: Write test passwords
        run: |
          cat > apps/server/config/passwords.yaml <<'EOF'
          test:
            database: ci_test_password
            emailSecretHashPepper: ci_test_pepper
            jwtHmacSha512PrivateKey: ci_test_jwt_key
            jwtRefreshTokenHashPepper: ci_test_refresh_pepper
          EOF

      - name: Apply migrations
        working-directory: apps/server
        run: dart bin/main.dart --role maintenance --apply-migrations --mode test

      - name: Run integration tests
        working-directory: apps/server
        run: dart test

  build-android:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/client/android/**/*.gradle*', 'apps/client/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Resolve workspace
        run: flutter pub get

      # Signed with the debug keys for now; the real keystore arrives in T-072.
      - name: Build APK
        working-directory: apps/client
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: apps/client/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
